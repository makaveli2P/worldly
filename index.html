<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set theme, map style and view before first paint. src/ui/prefs.ts keeps them in sync later.
      // theme-color is the header (panel) colour; keep it in step with META_COLOR in src/ui/prefs.ts.
      // src/main.ts reads data-view to start the map chunk early.
      (function () {
        var t = null, s = null, v = null;
        try {
          t = localStorage.getItem('worldly:theme');
          s = localStorage.getItem('worldly:style');
          v = localStorage.getItem('worldly:view');
        } catch (e) {}
        // Default: dark Atlas on the globe. A saved choice wins (src/ui/prefs.ts writes it).
        if (t !== 'light' && t !== 'dark') t = 'dark';
        var d = document.documentElement;
        d.dataset.theme = t;
        d.dataset.style = s === 'satellite' ? 'satellite' : 'atlas';
        d.dataset.view = v === 'map' ? 'map' : 'globe';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#1A1A1A' : '#FFFFFF');
      })();
    </script>
    <script>
      // Start the data with the HTML, before the module loads. src/main.ts reuses these promises.
      (function () {
        var json = function (url) {
          return fetch(url).then(function (r) {
            if (!r.ok) throw new Error(url + ': ' + r.status);
            return r.json();
          });
        };
        var later, laterTexture;
        var boot = (window.__worldlyBoot = {
          world: json('/data/world.json'),
          lite: json('/data/countries-lite.json'),
          labels: json('/data/labels.json').catch(function () {
            return null;
          }),
          countries: new Promise(function (resolve) {
            later = resolve;
          }),
          // The first satellite texture tier as a Blob, or null. The build puts its hashed name here (vite.config.ts).
          texture: {
            url: '%WORLDLY_TEXTURE_FIRST%',
            blob: new Promise(function (resolve) {
              laterTexture = resolve;
            }),
          },
        });
        // src/main.ts handles a failure; this keeps the console free of "unhandled rejection" until then.
        boot.world.catch(function () {});
        boot.lite.catch(function () {});
        boot.countries.catch(function () {});
        boot.texture.blob.catch(function () {});
        // The full countries.json (for the panels) and the first texture tier start when the first files
        // are in, so that they do not take bandwidth from them on a slow link. src/globe/Globe.ts decodes
        // the Blob with createImageBitmap. A fetch() and not a <link rel=preload>: WebKit does not give a
        // preloaded file to the later fetch() of ImageBitmapLoader, and loads the file two times.
        var next = function () {
          later(json('/data/countries.json'));
          if (document.documentElement.dataset.style !== 'satellite') return laterTexture(null);
          laterTexture(
            fetch(boot.texture.url).then(function (r) {
              if (!r.ok) throw new Error(boot.texture.url + ': ' + r.status);
              return r.blob();
            }),
          );
        };
        Promise.all([boot.world, boot.lite]).then(next, next);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The title, the description, the canonical link and the social tags. vite.config.ts (worldlySeo) puts
         them between these markers from src/data/seo.ts. Keep the markers: each country page replaces this block. -->
    <!-- worldly:head --><!-- /worldly:head -->
    <style>
      /* The first paint, before the CSS and the module load. It copies .loader in src/styles.css. */
      html {
        background: var(--paper, #e6e6e1);
      }
      :root[data-theme='dark'] {
        background: var(--paper, #0a0a0a);
      }
      #boot {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        /* A system face: the web fonts would take bandwidth from the data. */
        font: 400 11px/16px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted, #5c5c58);
      }
      :root[data-theme='dark'] #boot {
        color: var(--muted, #9a9a94);
      }
      /* A short text summary for crawlers that do not run JavaScript. It is visible, small and under the
         loader line. src/main.ts removes it when the globe is on screen. */
      #seo {
        position: fixed;
        top: calc(50% + 40px);
        left: 16px;
        right: 16px;
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
        font: 400 12px/18px system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #5c5c58;
        max-height: calc(50% - 56px);
        overflow: auto;
        pointer-events: auto;
        transition: opacity 400ms ease;
      }
      /* The summary does not catch clicks while it fades. */
      #seo[data-hidden] {
        opacity: 0;
        pointer-events: none;
      }
      #seo h1 {
        margin: 0 0 4px;
        font: 500 13px/18px system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #111111;
      }
      #seo p {
        margin: 0 0 4px;
      }
      #seo h2 {
        margin: 8px 0 2px;
        font: 500 12px/18px system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #seo summary {
        cursor: pointer;
      }
      #seo a {
        color: inherit;
      }
      :root[data-theme='dark'] #seo {
        color: #9a9a94;
      }
      :root[data-theme='dark'] #seo h1 {
        color: #f2f2ee;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p id="boot" class="loader">Loading the map</p>
    <!-- worldly:summary --><!-- /worldly:summary -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
