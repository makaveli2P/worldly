<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldly map harness</title>
    <style>
      /* DEV only: the flat map alone, with no panels. src/dev/mapHarness.ts reads the query string. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      #map {
        position: fixed;
        inset: 0;
      }
      #insets {
        position: fixed;
        pointer-events: none;
        outline: 1px dashed rgba(255, 0, 128, 0.6);
      }
      .globe-marker {
        position: absolute;
        top: -9px;
        left: -9px;
        width: 18px;
        height: 18px;
        border: 1.5px solid #f24b2f;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
      }
      .globe-marker[data-visible] {
        opacity: 1;
      }
      #log {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font: 12px/1.4 ui-monospace, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="insets"></div>
    <div id="log"></div>
    <script type="module" src="/src/dev/mapHarness.ts"></script>
  </body>
</html>
