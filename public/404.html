<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found · Worldly</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The same theme as the app (see the first script in index.html).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('worldly:theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      /* The look of the loader line in index.html. */
      html {
        background: #e6e6e1;
        color: #5c5c58;
      }
      :root[data-theme='dark'] {
        background: #0a0a0a;
        color: #9a9a94;
      }
      body {
        margin: 0;
      }
      main {
        position: fixed;
        top: 50%;
        left: 16px;
        right: 16px;
        transform: translateY(-50%);
        text-align: center;
        font: 400 11px/16px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 8px;
        font: inherit;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p><a href="/">Go to the globe</a></p>
    </main>
  </body>
</html>
